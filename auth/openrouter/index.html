<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Where OpenRouter returns after a sign-in from the app (#1396): an App Link, which Android opens
     in the app once the site's `/.well-known/assetlinks.json` vouches for it, so this page shows only
     when the link opens in a browser instead. It then says to go back to the app, and nothing more.
     The address holds the one-time code, of no use without the verifier that stays on the phone; the
     page records nothing, runs no script of its own, and sends the code nowhere: the policy below
     forbids any request but the site's own files, and `no-referrer` keeps the address out of them.
     In the documentation pages' type, header and footer, without their intro, as `api-keys.html`. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Back to Sleevesight | Sleevesight</title>
<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
<link rel="preload" href="{{ '/assets/fonts/RobotoFlex-page.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/RobotoSlab-page.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/site/chrome.css' | relative_url }}">
<script src="{{ '/assets/site/head.js' | relative_url }}"></script>
</head>
