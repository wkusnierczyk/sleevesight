# Robolectric installs Conscrypt as the first security provider by default, and the JDK cannot
# verify its jar, so every `Cipher` and `KeyGenerator` in the test JVM fails, Robolectric's tests
# and plain ones alike. The secret store's tests need the JDK's own AES-GCM.
conscryptMode=OFF

# Every Robolectric test runs on SDK 36 unless it sets its own (`@Config(sdk = …)`). Not
# `targetSdk` 37: Android 17's lock-free `MessageQueue`, on for apps targeting 37, needs
# `espresso-core` 3.7.0 or later, and Compose's test rule (`ui-test-junit4`) brings 3.5.0. Raise
# that first to move the tests to 37.
sdk=36
