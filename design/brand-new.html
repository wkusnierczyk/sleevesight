<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleevesight brand sheet</title>
<meta name="description" content="Sleevesight's logo, colours and type.">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<!-- The redesigned brand sheet (#327), built here beside `brand.html` and swapped in for it when done.
     Its frame is the product page's (`index.html`): the same header, with the 8b mark and the menu,
     the same intros, played on each visit, and the same three fonts, Roboto Flex for titles and
     labels, Roboto Slab for the running text and Roboto Mono for code, each a cut-down copy served
     from this site (`assets/fonts/make_page_font.py`), so text added here in new characters needs
     the copies remade. Unlike the product page, its ground is white. It keeps nothing in the
     browser. -->
<!-- Fetched at once rather than when the style sheet asks for it, so the text swaps to it sooner. -->
<link rel="preload" href="../assets/fonts/RobotoFlex-page.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/RobotoSlab-page.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Names of their own, so an installed Roboto never stands in for them. */
@font-face{font-family:"Sleevesight Flex";src:url(../assets/fonts/RobotoFlex-page.woff2) format("woff2");
  font-weight:400 700;font-stretch:88% 100%;font-display:swap}
@font-face{font-family:"Sleevesight Slab";src:url(../assets/fonts/RobotoSlab-page.woff2) format("woff2");
  font-weight:350 700;font-display:swap}
@font-face{font-family:"Sleevesight Mono";src:url(../assets/fonts/RobotoMono-page.woff2) format("woff2");
  font-weight:500;font-display:swap}
:root{
  --bg:#fff; --surface:#fafbfc; --sunken:#f0f2f5; --ink:#141a22; --muted:#596473; --line:#d2d8e0;
  --accent:#3346c9; --on-accent:#ffffff;
  --f-ui:"Sleevesight Flex",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-text:"Sleevesight Slab",ui-serif,Georgia,serif;
  --f-mono:"Sleevesight Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --sight:#cc212d;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0d1015; --surface:#151920; --sunken:#10141a; --ink:#e5e8ee; --muted:#96a0ad; --line:#29303a;
  --accent:#8e9cff; --on-accent:#0e1116;
  --sight:#f0443a;
  color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-text);font-weight:350;font-size:18px;line-height:1.55}
/* Titles, labels, the header and the skip link in Flex; the running text in Slab (body). Before the
   rules below, so their own weights win; the containers reset Slab's text weight to Flex's regular. */
h1,h2,h3{font-family:var(--f-ui)}
header.top,figcaption,.skip{font-family:var(--f-ui);font-weight:400}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:16px;top:-48px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:20}
.skip:focus{top:12px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
/* The header. At the top of the page it is large. Scrolled down, it stays at the top of the window,
   small (`.sl-compact`, set by the script at the end). Where the menu does not fit on one line beside the
   logo, its items go on lines of their own under it (`.sl-stack`); scrolled down, a stacked menu is
   hidden until the top. Without the script, the header is large and scrolls away with the page, and
   the menu stacks below 506 px, a little above where the script's own test stacks it (about 487 px
   with the page's Flex). */
header.top .row{display:flex;align-items:center;justify-content:space-between;gap:14px 24px;padding:20px 16px}
.brand{display:flex;align-items:center;flex:none;text-decoration:none}
/* The logo: the brand sheet's 8b mark, the words (`#words`) with the record (`#lp`) beside them, as
   tall as "sight". The svg is the words' ink box, 69 units tall, and 72 px tall at the top of the
   page. */
.brand>svg{display:block;flex:none;width:133.84px;height:72px;overflow:visible}
@media (max-width:370px){.brand>svg{width:107.82px;height:58px}}
nav.top{flex:none}
.sl-stack header.top .row{flex-direction:column;align-items:flex-start}
.sl-stack nav.top ul{flex-direction:column;gap:0}
.sl-stack nav.top a{display:block;padding:3px 0}
@media (max-width:506px){
  html:not(.js) header.top .row{flex-direction:column;align-items:flex-start}
  html:not(.js) nav.top ul{flex-direction:column;gap:0}
  html:not(.js) nav.top a{display:block;padding:3px 0}
}
.js{scroll-padding-top:80px}
.js header.top .bar{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--bg);border-bottom:1px solid transparent}
.sl-compact header.top .bar{border-bottom-color:var(--line);box-shadow:0 8px 18px -14px rgba(0,0,0,.45)}
.sl-compact header.top .row{padding-top:12px;padding-bottom:12px}
.sl-compact .brand>svg{width:66.92px;height:36px}
.sl-compact nav.top ul{font-size:15px;gap:4px 18px}
.sl-compact.sl-stack header.top .row{flex-direction:row}
.sl-compact.sl-stack nav.top{display:none}
@media (prefers-reduced-motion: no-preference){
  header.top .bar{transition:border-color .25s,box-shadow .25s}
  header.top .row{transition:padding .25s ease}
  .brand>svg{transition:width .25s ease,height .25s ease}
  nav.top ul{transition:font-size .25s ease}
}
.sl-still *{transition:none!important}
/* The words (`#words`): outlined from Roboto Flex 400 at 88% width (`assets/logo/src/make_tile.py`),
   so they need no font; "Sleeve" in ink, white on dark as on the brand sheet's black tile, and "sight"
   in `--sight`. Each word is a group of paths, one to a letter (`#w-sleeve-1` to `#w-sight-5`), so an
   intro can show or turn each letter on its own. The tile, in the intros only: white on light, black
   with a faint edge on dark. The record (`#lp`) is the eye logo's disc in its colours, set through
   variables, since a selector cannot reach into a <use>. On dark, the record's rim takes the outline's
   grey, and the groove gives way to a wider black disc, so the grey meets the black directly. */
:root{--tile-bg:#fff;--tile-edge:transparent;--tile-ink:#141a22;--rim:#1f2328;--core:none;--groove:inline}
@media (prefers-color-scheme: dark){:root{--tile-bg:#000;--tile-edge:#ffffff26;--tile-ink:#fff;--rim:#8b949e;--core:inline;--groove:none}}
.t-bg{fill:var(--tile-bg);stroke:var(--tile-edge)}
.t-ink{fill:var(--tile-ink)}
.t-red{fill:var(--sight)}
nav.top ul{list-style:none;margin:0;padding:0;display:flex;gap:4px 22px;font-size:17px;white-space:nowrap}
nav.top a{color:var(--muted);text-decoration:none}
nav.top a:hover{color:var(--ink);text-decoration:underline}

section{padding:48px 0;border-top:1px solid var(--line)}
section h2{margin:0 0 20px;font-size:clamp(26px,4vw,34px);line-height:1.15;font-weight:700;font-stretch:92%;letter-spacing:-.01em}
footer{border-top:1px solid var(--line);padding:24px 0 40px;font-size:15px;color:var(--muted)}
footer p{margin:0 0 4px}

/* The intro (`.sl-intro`): set by the scripts when motion is allowed and the address has no `#`. As
   it starts, the address gains a bare `#` (the top of the page), so a reload skips it; so does a link
   copied from the address bar after it. One of those below, picked at random (`data-logo`); no address
   picks one. Each plays large in the middle of the window (`.splash`) and ends on the 8b mark, which then
   shrinks onto the header's (`--fx`, `--fy`, `--fs`, measured by the script), where the header's own
   logo takes over at `--land` and the rest of the page fades in. Scrolling, a key or a click ends the
   intro at once. A click on the logo plays one again where the page is (`replay()`).
   - C (`.sp-c`): the mark fades in (0-0.7 s), turns twice about the record's centre (0.9-2.9 s), and
     shrinks onto the header (3.3-3.95 s).
   - D (`.sp-d`): the tile, on C's timings, turning about the dot of the i; the tile fades as it flies,
     so the words land on the page, and the record then turns in beside "sight", growing as it fades
     in (4.2-4.9 s).
   - F (`.sp-f`): the mark fades in, and the record circles the words once about the dot of the i, the
     words staying still (0.9-2.9 s), on C's timings; the splash is a square centred on the dot, with
     room for the record's path (92.04 units from the dot at the farthest).
   - G (`.sp-g`): the record fades in alone, where it sits in the mark, and the words are typed in
     beside it, a letter at a time (`--at`, 0.9-2.68 s): an uneven beat, 120-210 ms between letters,
     and 360 ms between the lines, as for a return; no caret. Then the flight, on C's timings.
   - H (`.sp-h`): the mark fades in, and each e of "Sleeve" turns once about the centre of its ink, as
     the record does on hover (`lg-turn`, 900 ms), one after the other from the left, each 600 ms after
     the one before (0.9-3 s). Then the flight, on C's timings.
   - I (`.sp-i`): the record fades in where it sits in the mark, with the words to its right,
     left-aligned with each other, as far from it as "sight" is in the mark (10 units). Each word then
     slides left into its place, on C's turning easing: "Sleeve" (0.9-2.05 s), then "sight" (1.75-2.9 s),
     starting before "Sleeve" lands and passing behind the record, which is drawn over it. Then the
     flight, on C's timings.
   - R1 (`.sp-r1`): "Sleeve" fades in, and the record rolls in under it from the left, two and a
     quarter turns over its own circumference (2.25 × 2 × pi × 17.58 = 248.53 units), uncovering "sight"
     (0.7-3.15 s), fading in as it starts, since a wide window would otherwise show it waiting; then
     the flight (3.4-4.05 s).
   - R2 (`.sp-r2`): the tile slides left off the record behind it (0.56-2.1 s); the record shrinks into
     its place beside "sight" and the tile fades, leaving the words (2.52-3.92 s); then the flight
     (4.1-4.75 s).
   The reveals' timelines are the brand sheet's, played once. Hovering over or focusing the logo
   (`.play`) spins the record once in place. Nothing moves under "reduce motion". */
:root{--fly:3300ms;--land:3950ms}
[data-logo="r1"]{--fly:3400ms;--land:4050ms}
[data-logo="r2"]{--fly:4100ms;--land:4750ms}
.brand .lp-disc{transform-box:fill-box;transform-origin:center}
.splash{display:none}
.sl-intro .splash{position:fixed;z-index:30;left:var(--sx);top:var(--sy);pointer-events:none}
.sl-intro[data-logo="c"] .sp-c,.sl-intro[data-logo="d"] .sp-d,.sl-intro[data-logo="f"] .sp-f,
.sl-intro[data-logo="g"] .sp-g,.sl-intro[data-logo="h"] .sp-h,.sl-intro[data-logo="i"] .sp-i{display:block;animation:tl-in 700ms ease-out both,sl-gone 1ms var(--land) forwards}
.sl-intro[data-logo="r1"] .sp-r1,.sl-intro[data-logo="r2"] .sp-r2{display:block;animation:sl-gone 1ms var(--land) forwards}
.splash .fly{width:var(--sb);height:var(--sbh);transform-origin:0 0;animation:sl-fly 650ms cubic-bezier(.3,0,.2,1) var(--fly) both}
.splash .spin{width:100%;height:100%;animation:tl-spin 2000ms cubic-bezier(.45,0,.55,1) 900ms both}
.splash svg{display:block;width:100%;height:100%;overflow:visible}
/* The record's path is about the dot, the origin of the words' units. */
.sp-f .orbit{transform-box:view-box;transform-origin:0 0;animation:lg-turn 2000ms cubic-bezier(.45,0,.55,1) 900ms both}
/* G's letters each show at their key's moment. H's e's each turn about the centre of their ink (set
   on each <use> in the words' units, `transform-box: view-box`), on the hover's spin (`lg-turn`,
   900 ms). */
.sp-g .key{animation:tl-in 1ms var(--at) both}
.sp-h .turn{transform-box:view-box;animation:lg-turn 900ms cubic-bezier(.45,0,.55,1) var(--at) both}
/* I's words slide in from where they start, right of the record, each by its own distance in the
   words' units. */
.sp-i .i-sleeve{animation:i-sleeve 1150ms cubic-bezier(.45,0,.55,1) 900ms both}
.sp-i .i-sight{animation:i-sight 1150ms cubic-bezier(.45,0,.55,1) 1750ms both}
.sp-d .t-bg{animation:tl-bare 650ms cubic-bezier(.3,0,.2,1) var(--fly) both}
.splash .rv-all{animation:rv-all 7s both}
.r1-rec{transform-box:fill-box;transform-origin:center;animation:r1-turn 7s both}
.r1-roll{animation:r1-roll 7s both,r1-show 7s both}
.r1-wipe{animation:r1-roll 7s both}
.r2-pan{animation:r2-pan 7s both}
.r2-tile{animation:r2-slide 7s both}
.r2-bg{animation:r2-bg 7s both}
.r2-rec{animation:r2-shrink 7s both}
.sl-wait header.top .brand,.sl-wait header.top nav,.sl-wait main,.sl-wait footer{opacity:0}
.sl-intro .brand>svg{animation:sl-hold var(--land)}
.sl-intro header.top nav,.sl-intro main,.sl-intro footer{animation:sl-arrive 450ms ease-out var(--land) both}
.sl-intro[data-logo="d"] .brand .lp-disc{animation:d-rec 700ms cubic-bezier(.2,0,.2,1) calc(var(--land) + 250ms) both}
@media (prefers-reduced-motion: no-preference){
  .brand.play .lp-disc{animation:lg-turn 900ms cubic-bezier(.45,0,.55,1)}
}
@keyframes sl-fly{to{transform:translate(var(--fx),var(--fy)) scale(var(--fs))}}
@keyframes sl-gone{from,to{visibility:hidden;opacity:0}}
@keyframes sl-hold{from,to{opacity:0}}
@keyframes sl-arrive{from{opacity:0}}
@keyframes tl-in{from{opacity:0}}
@keyframes tl-bare{to{opacity:0}}
@keyframes tl-spin{from{transform:rotate(0)}to{transform:rotate(720deg)}}
@keyframes lg-turn{to{transform:rotate(360deg)}}
@keyframes i-sleeve{from{transform:translateX(138.27px)}}
@keyframes i-sight{from{transform:translateX(117.58px)}}
@keyframes d-rec{from{opacity:0;transform:rotate(-360deg) scale(.6)}to{opacity:1;transform:none}}
@keyframes rv-all{0%{opacity:0}5%,100%{opacity:1}}
@keyframes r1-roll{0%,10%{transform:translateX(-248.53px);animation-timing-function:cubic-bezier(.45,0,.3,1)}45%,100%{transform:none}}
@keyframes r1-turn{0%,10%{transform:rotate(-810deg);animation-timing-function:cubic-bezier(.45,0,.3,1)}45%,100%{transform:none}}
@keyframes r1-show{0%,10%{opacity:0}20%,100%{opacity:1}}
@keyframes r2-pan{0%,36%{transform:translateX(-39.5px);animation-timing-function:cubic-bezier(.45,0,.3,1)}56%,100%{transform:none}}
@keyframes r2-slide{0%,8%{transform:translateX(140px);animation-timing-function:cubic-bezier(.45,0,.2,1)}30%,100%{transform:none}}
@keyframes r2-bg{0%,38%{opacity:1}54%,100%{opacity:0}}
@keyframes r2-shrink{0%,36%{transform:translate(-126.12px,-51.55px) scale(3.6405);animation-timing-function:cubic-bezier(.45,0,.3,1)}56%,100%{transform:none}}
@media (max-width:560px){
  body{font-size:17px}
  section{padding:36px 0}
}
</style>
<script>
document.documentElement.classList.add('js');
// Set before the first paint: the intro (`data-logo`), and its wait, so the page never shows before
// the intro starts.
(function () {
  var root = document.documentElement, all = ['c', 'd', 'f', 'g', 'h', 'i', 'r1', 'r2'];
  root.setAttribute('data-logo', all[Math.floor(Math.random() * all.length)]);
  // `location.hash` is empty for a bare `#`, so the address is read whole.
  if (location.href.indexOf('#') !== -1 || !matchMedia('(prefers-reduced-motion: no-preference)').matches) return;
  root.classList.add('sl-wait');
})();
</script>
</head>

<script>
(function () {
  var root = document.documentElement, header = document.querySelector('header.top'), bar = header.querySelector('.bar'),
      row = bar.querySelector('.row'), brand = row.querySelector('.brand'), mark = brand.querySelector('svg'),
      nav = row.querySelector('nav');
  // Lays out the large header, as it is at the top of the page, without animating it: whether the menu
  // fits on one line beside the logo, and the height the header keeps in the page while it is small.
  function measure() {
    var compact = root.classList.contains('sl-compact');
    root.classList.add('sl-still');
    root.classList.remove('sl-compact', 'sl-stack');
    var room = row.clientWidth - parseFloat(getComputedStyle(row).paddingLeft) * 2;
    root.classList.toggle('sl-stack', brand.offsetWidth + 24 + nav.offsetWidth > room);
    header.style.height = bar.offsetHeight + 'px';
    root.classList.toggle('sl-compact', compact);
    void bar.offsetHeight;
    root.classList.remove('sl-still');
  }
  function onScroll() { root.classList.toggle('sl-compact', scrollY > 4); }
  measure();
  onScroll();
  addEventListener('resize', measure);
  // The menu's width changes when the page's font arrives (`font-display: swap`), after the first layout.
  if (document.fonts) document.fonts.ready.then(measure);
  addEventListener('scroll', onScroll, {passive: true});

  // A resize (a phone turned) would leave the splash's places stale, and focus can arrive without a
  // key (a screen reader's cursor), so either ends the intro too.
  var stops = ['wheel', 'touchstart', 'keydown', 'pointerdown', 'scroll', 'resize', 'focusin'],
      moving = matchMedia('(prefers-reduced-motion: no-preference)'), v;
  function end() {
    stops.forEach(function (e) { removeEventListener(e, stop); });
    root.classList.remove('sl-intro');
  }
  // A held key's repeats (Enter or Space on the logo) do not end the intro it started.
  function stop(e) { if (!(e.type === 'keydown' && e.repeat)) end(); }
  function listen() { stops.forEach(function (e) { addEventListener(e, stop, {passive: true}); }); }
  // The intro ends with its last move: D's record turning in, the others' page arriving.
  function last(e) { if (e.animationName === (v === 'd' ? 'd-rec' : 'sl-arrive')) end(); }
  brand.addEventListener('animationend', last);
  document.querySelector('main').addEventListener('animationend', last);
  // Each splash's svg in the words' units: its viewBox's left, top, width and height. C's is a square of
  // 256 centred on the record, with room for the words' sweep (119.5 from the record's centre at the
  // farthest); D's is the tile, 144 across, with room for its corners as it turns; F's is a square of
  // 188 centred on the dot, with room for the record's path; G's and H's are the header's box, the
  // mark's ink, since nothing in them leaves it; I's is the mark's ink widened to the right, to 183.79,
  // past where "Sleeve" starts (183.26 at the farthest), so it is centred on the record horizontally,
  // and the record stays still midway across the window; R1's and R2's are the brand sheet's reveals.
  var boxes = {c: [-54.9, -113.84, 256, 256], d: [-72, -72, 144, 144], f: [-94, -94, 188, 188],
               g: [-37.59, -37.26, 128.27, 69], h: [-37.59, -37.26, 128.27, 69],
               i: [-37.59, -37.26, 221.38, 69],
               r1: [-56.4, -45.76, 166, 86], r2: [-119.5, -82.76, 292, 160]};
  function start() {
    // The splash is centred in the window, at most 300/144 px to the unit (D's tile 300 px across), less
    // where the window is too small for it. The header's logo is the words' ink box, from -37.59, -37.26
    // and 69 tall, so the splash lands where the header's logo sits in it.
    v = root.getAttribute('data-logo');
    var b = boxes[v], m = mark.getBoundingClientRect(), u = m.height / 69,
        k = v === 'd' ? Math.min(300, innerWidth * .62, innerHeight * .45) / 144
                      : Math.min(300 / 144, innerWidth * .95 / b[2], innerHeight * .9 / b[3]),
        w = b[2] * k, h = b[3] * k, x = (innerWidth - w) / 2, y = (innerHeight - h) / 2;
    root.style.setProperty('--sb', w + 'px');
    root.style.setProperty('--sbh', h + 'px');
    root.style.setProperty('--sx', x + 'px');
    root.style.setProperty('--sy', y + 'px');
    root.style.setProperty('--fx', m.left + (b[0] + 37.59) * u - x + 'px');
    root.style.setProperty('--fy', m.top + (b[1] + 37.26) * u - y + 'px');
    root.style.setProperty('--fs', u / k);
    root.classList.remove('sl-wait');
    root.classList.add('sl-intro');
    if (location.href.indexOf('#') === -1) history.replaceState(null, '', location.href + '#');
  }
  if (root.classList.contains('sl-wait')) {
    start();
    listen();
  }

  // The replay: a click on the logo, a step up from the hover's spin. It plays an intro picked afresh,
  // as on a new visit, where the page is: the splash flies to the header's logo as it is, small when
  // scrolled down, and the page fades back in at the same place. The header's transitions are settled
  // first (`.sl-still`), so a click just after a scroll measures the logo where it ends up. Reading the
  // layout between taking the class off and putting it back restarts the animations. The stops listen
  // from the next frame on, so that nothing of the click or key that started the replay can end it.
  function replay() {
    end();
    brand.classList.remove('play');
    var all = Object.keys(boxes);
    root.setAttribute('data-logo', all[Math.floor(Math.random() * all.length)]);
    root.classList.add('sl-still');
    void bar.offsetHeight;
    start();
    root.classList.remove('sl-still');
    requestAnimationFrame(listen);
  }
  // Where motion is allowed, the logo is a button that plays the intro, named so, and Space presses it
  // as well as Enter. Under "reduce motion" it is the link to the top of the page, as without the
  // script; it follows the setting if that changes. A click with a modifier, or another button, keeps
  // the link's own behaviour (a new tab, say).
  function role() {
    if (moving.matches) {
      brand.setAttribute('role', 'button');
      brand.setAttribute('aria-label', 'Sleevesight, play the intro');
    } else {
      brand.removeAttribute('role');
      brand.setAttribute('aria-label', 'Sleevesight, top of the page');
    }
  }
  role();
  if (moving.addEventListener) moving.addEventListener('change', role);
  brand.addEventListener('click', function (e) {
    if (!moving.matches || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    replay();
  });
  // Space's repeats are cancelled too, or a held Space would scroll the page.
  brand.addEventListener('keydown', function (e) {
    if (!moving.matches || e.key !== ' ') return;
    e.preventDefault();
    if (!e.repeat) replay();
  });

  function play() {
    if (!moving.matches || root.classList.contains('sl-intro')) return;
    brand.classList.add('play');
  }
  brand.addEventListener('pointerenter', play);
  brand.addEventListener('focus', play);
  brand.addEventListener('animationend', function (e) {
    if (e.animationName === 'lg-turn') brand.classList.remove('play');
  });
})();
