# Direct project dependencies each module may have (architecture, Modules).
# A module with no entry fails the check, so a new module is a reviewed decision.
core=
net=
sources=core,net
ai=core,net
wiring=core,sources,ai,net
store=core
cli=core,store,wiring,net
app=core,sources,ai,store,wiring

# Modules that may not be on a module's compile classpaths (its tests' included) at all, not even
# transitively, though they may be on its runtime classpath: `:app` never names a `:net` type, but
# the APK ships `:net` through `:sources`, `:ai` and `:wiring` (architecture, *Modules*).
compile-forbidden.app=net

# HTTP clients may be reached only through these modules, directly or through a library.
network-groups=io.ktor,com.squareup.okhttp3,com.squareup.retrofit2
network-modules=net
