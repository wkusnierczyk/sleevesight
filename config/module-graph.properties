# Direct project dependencies each module may have (architecture, Modules).
# A module with no entry fails the check, so a new module is a reviewed decision.
core=
net=
sources=core,net
ai=core,net
store=core
cli=core,sources,ai,store
app=core,sources,ai,store
# The Phase 0 probe stands alone and is removed after the Phase 0 gate.
spike=

# Only these modules may depend directly on an HTTP client.
network-groups=io.ktor,com.squareup.okhttp3
network-modules=net
