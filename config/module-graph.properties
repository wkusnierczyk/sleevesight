# Direct project dependencies each module may have (architecture, Modules).
# A module with no entry fails the check, so a new module is a reviewed decision.
core=
net=
sources=core,net
ai=core,net
store=core
cli=core,sources,ai,store,net
app=core,sources,ai,store

# HTTP clients may be reached only through these modules, directly or through a library.
network-groups=io.ktor,com.squareup.okhttp3,com.squareup.retrofit2
network-modules=net
