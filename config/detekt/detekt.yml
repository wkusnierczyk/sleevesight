# Additions to Detekt's default configuration, for every module.
style:
  MaxLineLength:
    maxLineLength: 120
  # Network access only through :net (design, Structural constraints). :net has its own
  # configuration, config/detekt/net.yml. The `checkNetworkReferences` task in
  # build-logic/src/main/kotlin/sleevesight.pipeline.gradle.kts checks the same packages in the
  # compiled classes of the pipeline modules; a change to one list is made to the other.
  ForbiddenImport:
    active: true
    imports:
      - value: 'java.net.*'
        reason: 'Network access goes through :net.'
      - value: 'javax.net.*'
        reason: 'Network access goes through :net.'
      - value: 'okhttp3.*'
        reason: 'Network access goes through :net.'
      - value: 'io.ktor.client.*'
        reason: 'Network access goes through :net.'
