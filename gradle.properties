# Metaspace at 2g, not 1g: each `build` runs R8 on the release variant, and a daemon kept between
# builds ran out of metaspace in R8 at 1g (#130).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true
# `jvmMain` sees `main`'s internals through its classes, not its jar, which also carries `jvmMain`
# (build-logic/src/main/kotlin/sleevesight.jvm-main.gradle.kts).
kotlin.build.archivesTaskOutputAsFriendModule=false
