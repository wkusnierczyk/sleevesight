<!-- The site's own head snippets, included by the default Pages theme. -->
<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
<!-- Mermaid diagrams: GitHub renders them, Jekyll leaves them as code blocks. Pinned version,
     loaded only on pages that have one, from jsDelivr: the one script the site does not serve
     itself, since Mermaid's build is some 3.5 MB (the privacy policy names jsDelivr). -->
<script type="module">
  const blocks = document.querySelectorAll("pre > code.language-mermaid");
  if (blocks.length > 0) {
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs");
    for (const code of blocks) {
      const diagram = document.createElement("div");
      diagram.className = "mermaid";
      diagram.textContent = code.textContent;
      (code.closest("div.highlighter-rouge") ?? code.parentElement).replaceWith(diagram);
    }
    mermaid.initialize({ startOnLoad: false });
    await mermaid.run({ querySelector: ".mermaid" });
  }
</script>
