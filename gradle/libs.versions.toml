[versions]
agp = "9.4.1"
kotlin = "2.4.21"
detekt = "1.23.8"
ktlint-gradle = "14.2.0"
# ktlint itself, set here rather than left to the plugin's default, so the pre-commit hook
# (`.githooks/pre-commit`) formats with the same version; a new version needs its checksum there.
ktlint = "1.5.0"
ktor = "3.6.1"
okhttp = "5.5.1"
kotlinx-serialization = "1.12.0"
kotlinx-coroutines = "1.11.0"
asm = "9.11.1"
sqldelight = "2.4.1"
androidx-compose-bom = "2026.09.00"
androidx-activity = "1.13.0"
androidx-navigation = "2.10.2"
androidx-lifecycle = "2.11.0"
androidx-datastore = "1.2.1"
# The art's colours (design, *User interface*): a Kotlin port of Google's material-color-utilities.
materialkolor = "6.0.0"
# QR codes of the API keys (#268): drawn by the CLI, read by the app's camera; decoded on the phone.
zxing = "3.5.4"
junit4 = "4.13.2"
robolectric = "4.17"

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
sqldelight-gradle-plugin = { module = "app.cash.sqldelight:gradle-plugin", version.ref = "sqldelight" }
kotlin-compose-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

# Floors for the libraries the build's own tools bring in (the Gradle plugins, Android lint, ktlint,
# the tests' Robolectric): the lowest version of each with no known vulnerability (#1087). They
# raise a lower version, never add a library or lower one, and leave the classpaths that ship (the
# lockfiles) alone. `build-logic/build.gradle.kts` and `sleevesight.locking` apply every
# `build-floor-*` entry.
build-floor-guava = "com.google.guava:guava:33.8.0-jre"
build-floor-bcprov = "org.bouncycastle:bcprov-jdk18on:1.86"
build-floor-bcpkix = "org.bouncycastle:bcpkix-jdk18on:1.86"
build-floor-bcutil = "org.bouncycastle:bcutil-jdk18on:1.86"
build-floor-jose4j = "org.bitbucket.b_c:jose4j:0.9.7"
build-floor-jdom2 = "org.jdom:jdom2:2.0.6.1"
build-floor-commons-lang3 = "org.apache.commons:commons-lang3:3.21.0"
build-floor-httpclient = "org.apache.httpcomponents:httpclient:4.5.14"
build-floor-logback-core = "ch.qos.logback:logback-core:1.6.6"
build-floor-logback-classic = "ch.qos.logback:logback-classic:1.6.6"

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
materialkolor-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "materialkolor" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
