<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -2 64 36" role="img" aria-label="Sleevesight: a record slides out of its sleeve and becomes an eye">
<!-- A record slides out of its sleeve (the simulator's generated cover for Sundown by Gordon Lightfoot),
     the eye forms around it, blinks, the record turns twice, the eye blinks again, and the sleeve
     comes back. A 10 s loop. -->
<style>
  .bg { fill: #fafbfc }
  .eye { fill: none; stroke: #1f2328 }
  .shut { stroke: #1f2328 }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1015 }
    .eye { fill: #ffffff; stroke: #8b949e }
    .rim { fill: #8b949e }
    .groove { display: none }
    .shut { stroke: #8b949e }
    .shadow { opacity: .55 }
  }
  .lid, .clip, .disc { transform-box: view-box; transform-origin: 16px 16px }
  .sleeve { animation: sleeve 10s infinite }
  .eyes { animation: eye 10s infinite linear }
  .lid, .clip { animation: blink 10s infinite }
  .shut { opacity: 0; animation: shut 10s infinite steps(1, end) }
  .disc { animation: spin 10s infinite }
  /* Slides left by half (0.8–1.7 s), leaves (2.8–3.8 s), comes back (8.4–9.4 s). */
  @keyframes sleeve {
    0%, 8.00% { transform: translateX(0); animation-timing-function: cubic-bezier(.45,0,.2,1) }
    17.00%, 28.00% { transform: translateX(-8.2px); animation-timing-function: cubic-bezier(.55,0,1,.45) }
    38.00%, 84.00% { transform: translateX(-42.20px); animation-timing-function: cubic-bezier(0,.55,.45,1) }
    94.00%, 100% { transform: translateX(0) }
  }
  /* The eye: its right corner appears at 1.8–2.3 s (the left one is under the sleeve), gone by 9.3 s. */
  @keyframes eye { 0%, 18.00% { opacity: 0 } 23.00%, 86.00% { opacity: 1 } 93.00%, 100% { opacity: 0 } }
  @keyframes blink { 0%{transform:scaleY(1);animation-timing-function:cubic-bezier(.5,0,1,1)} 44.00%{transform:scaleY(1);animation-timing-function:cubic-bezier(.5,0,1,1)} 45.00%,45.40%{transform:scaleY(.02);animation-timing-function:cubic-bezier(0,0,.4,1)} 46.80%{transform:scaleY(1);animation-timing-function:cubic-bezier(.5,0,1,1)} 71.00%{transform:scaleY(1);animation-timing-function:cubic-bezier(.5,0,1,1)} 72.00%,72.40%{transform:scaleY(.02);animation-timing-function:cubic-bezier(0,0,.4,1)} 73.80%{transform:scaleY(1);animation-timing-function:cubic-bezier(.5,0,1,1)} 100%{transform:scaleY(1)} }
  @keyframes shut { 0%{opacity:0} 44.80%{opacity:1} 45.68%{opacity:0} 71.80%{opacity:1} 72.68%{opacity:0} }
  /* Two turns, 4.9–6.9 s, starting and stopping like a turntable. */
  @keyframes spin {
    0%, 49.00% { transform: rotate(0); animation-timing-function: cubic-bezier(.45,0,.55,1) }
    69.00%, 100% { transform: rotate(720deg) }
  }
  @media (prefers-reduced-motion: reduce) { .sleeve, .eyes, .lid, .clip, .shut, .disc { animation: none } .sleeve { display: none } }
</style>
<defs>
  <clipPath id="eyeclip"><path class="clip" d="M1.5 16 Q16 -.25 30.5 16 Q16 32.25 1.5 16 Z"/></clipPath>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".35"/></filter>
</defs>
<rect class="bg" x="-16" y="-2" width="64" height="36"/>
<g class="eyes">
  <path class="eye lid" d="M1.5 16 Q16 3 30.5 16 Q16 29 1.5 16 Z" stroke-width="2" stroke-linejoin="round"/>
</g>
<g clip-path="url(#eyeclip)"><g class="disc">
  <circle class="rim" cx="16" cy="16" r="7.5" fill="#1f2328"/>
  <circle cx="16" cy="16" r="5.7" fill="#1f2328"/>
  <circle class="groove" cx="16" cy="16" r="5.4" fill="none" stroke="#57606a" stroke-width=".8"/>
  <circle cx="16" cy="16" r="3" fill="#cf222e"/>
  <path d="M14.4 14.9 A2 2 0 0 1 17.6 14.9" fill="none" stroke="#fff" stroke-width=".42" stroke-linecap="round"/>
  <path d="M15.1 18.05 H16.9" fill="none" stroke="#fff" stroke-width=".42" stroke-linecap="round"/>
  <circle cx="16" cy="16" r=".9" fill="#fff"/>
</g></g>
<path class="shut" d="M1.5 16 H30.5" stroke-width="2" stroke-linecap="round" fill="none"/>
<g class="sleeve">
  <!-- Background left of the sleeve: the returning sleeve wipes the eye's left corner away. -->
  <rect class="bg" x="-192.20" y="-2" width="200" height="36"/>
  <rect class="shadow" x="8.05" y="8.20" width="16.4" height="16.4" rx=".25" fill="#000" opacity=".22" filter="url(#soft)"/>
  <svg x="7.80" y="7.80" width="16.4" height="16.4" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g2274348758" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(158 55% 32%)"/><stop offset="1" stop-color="hsl(193 50% 13%)"/></linearGradient></defs><rect width="100" height="100" fill="url(#g2274348758)"/><circle cx="12" cy="12" r="5.9" fill="hsl(225 70% 66%)"/><circle cx="12" cy="31" r="7.6" fill="hsl(225 70% 66%)"/><circle cx="12" cy="50" r="4.2" fill="hsl(225 70% 66%)"/><circle cx="12" cy="69" r="5.9" fill="hsl(225 70% 66%)"/><circle cx="12" cy="88" r="4.2" fill="hsl(225 70% 66%)"/><circle cx="31" cy="12" r="5.9" fill="hsl(225 70% 66%)"/><circle cx="31" cy="31" r="4.2" fill="hsl(225 70% 66%)"/><circle cx="31" cy="50" r="5.9" fill="hsl(225 70% 66%)"/><circle cx="31" cy="69" r="7.6" fill="hsl(225 70% 66%)"/><circle cx="31" cy="88" r="4.2" fill="hsl(225 70% 66%)"/><circle cx="50" cy="12" r="7.6" fill="hsl(225 70% 66%)"/><circle cx="50" cy="31" r="4.2" fill="hsl(225 70% 66%)"/><circle cx="50" cy="50" r="5.9" fill="hsl(225 70% 66%)"/><circle cx="50" cy="69" r="7.6" fill="hsl(225 70% 66%)"/><circle cx="50" cy="88" r="7.6" fill="hsl(225 70% 66%)"/><circle cx="69" cy="12" r="7.6" fill="hsl(225 70% 66%)"/><circle cx="69" cy="31" r="7.6" fill="hsl(225 70% 66%)"/><circle cx="69" cy="50" r="4.2" fill="hsl(225 70% 66%)"/><circle cx="69" cy="69" r="2.5" fill="hsl(225 70% 66%)"/><circle cx="69" cy="88" r="5.9" fill="hsl(225 70% 66%)"/><circle cx="88" cy="12" r="2.5" fill="hsl(225 70% 66%)"/><circle cx="88" cy="31" r="5.9" fill="hsl(225 70% 66%)"/><circle cx="88" cy="50" r="7.6" fill="hsl(225 70% 66%)"/><circle cx="88" cy="69" r="7.6" fill="hsl(225 70% 66%)"/><circle cx="88" cy="88" r="7.6" fill="hsl(225 70% 66%)"/></svg>
</g>
</svg>
