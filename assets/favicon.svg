<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 16 16">
  <!-- The record from the logo, without the eye around it: at tab size the eye's corners took most of
       the width, so the record alone, filling the square, reads better. In the logo's coordinates:
       the record's outer circle (the rim, radius 7.5 about 16,16), a groove, the label, and the
       spindle hole. On dark, the rim takes the grey of the logo's outline, to stand apart from a dark
       tab bar, and a black disc (the core) inside it leaves the grey as a thin outer ring, thinner
       than the black band, so it reads as a record rather than a target; the groove stays, drawn on
       the black. The ring is 1.2 units where the browser draws the SVG at 32 px or less, and 0.9
       where it draws it larger (a bookmark or a new-tab tile), where the thinner ring reads better.
       Inside an SVG used as an image, a media query's width is the size the browser draws it at,
       in device pixels: Chrome draws a tab's favicon at 32 px however wide the tab icon is, and
       Firefox at the tab icon's device pixels, 16 or 32, so tab icons get the 1.2 ring, which at
       1x stays a pixel wide where 0.9 would blur. A browser that ignores the query shows 0.9. The
       core is drawn only on dark: on light, its edge would darken the rim's antialiased edge. -->
  <style>
    .core { display: none }
    @media (prefers-color-scheme: dark) { .rim { fill: #8b949e } .core.wide { display: inline } }
    @media (prefers-color-scheme: dark) and (max-width: 32px) { .core.wide { display: none } .core.narrow { display: inline } }
  </style>
  <circle class="rim" cx="16" cy="16" r="7.5" fill="#1f2328"/>
  <circle class="core wide" cx="16" cy="16" r="6.6" fill="#1f2328"/>
  <circle class="core narrow" cx="16" cy="16" r="6.3" fill="#1f2328"/>
  <circle class="groove" cx="16" cy="16" r="5.4" fill="none" stroke="#57606a" stroke-width=".8"/>
  <circle cx="16" cy="16" r="3" fill="#cf222e"/>
  <circle cx="16" cy="16" r=".9" fill="#ffffff"/>
</svg>
