<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A record as the iris of an eye: the eye, the disc, a groove, and the label. On dark, the eye
       is filled white and outlined in grey, to stand apart from the background, and the record's rim
       takes the outline's grey, so it merges with the outline as the black rim does on light; the
       groove is left out, so the grey meets the black of the disc. -->
  <style>
    .eye { fill: none; stroke: #1f2328 }
    @media (prefers-color-scheme: dark) { .eye { fill: #ffffff; stroke: #8b949e } .rim { fill: #8b949e } .groove { display: none } }
  </style>
  <path class="eye" d="M1.5 16 Q16 3 30.5 16 Q16 29 1.5 16 Z" stroke-width="2" stroke-linejoin="round"/>
  <circle class="rim" cx="16" cy="16" r="7.5" fill="#1f2328"/>
  <circle cx="16" cy="16" r="5.7" fill="#1f2328"/>
  <circle class="groove" cx="16" cy="16" r="5.4" fill="none" stroke="#57606a" stroke-width=".8"/>
  <circle cx="16" cy="16" r="3" fill="#cf222e"/>
  <circle cx="16" cy="16" r=".9" fill="#ffffff"/>
</svg>
