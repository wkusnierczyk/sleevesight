<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 16 16">
  <!-- The record from the logo, without the eye around it: at tab size the eye's corners took most of
       the width, so the record alone, filling the square, reads better. The disc, a groove, and the
       label, in the logo's coordinates (the disc's centre at 16,16, radius 7.5). On dark, the rim
       turns the logo's outline grey, to stand apart from a dark tab bar, and the groove gives way to
       a wider black disc, so the grey meets the black directly. The disc is drawn only on dark: on
       light, its edge would darken the rim's antialiased edge. -->
  <style>
    .core { display: none }
    @media (prefers-color-scheme: dark) { .rim { fill: #8b949e } .groove { display: none } .core { display: inline } }
  </style>
  <circle class="rim" cx="16" cy="16" r="7.5" fill="#1f2328"/>
  <circle class="core" cx="16" cy="16" r="5.7" fill="#1f2328"/>
  <circle class="groove" cx="16" cy="16" r="5.4" fill="none" stroke="#57606a" stroke-width=".8"/>
  <circle cx="16" cy="16" r="3" fill="#cf222e"/>
  <circle cx="16" cy="16" r=".9" fill="#ffffff"/>
</svg>
