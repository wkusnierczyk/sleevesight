name: Mutation testing

# Pitest on the code that stores, parses and moves the users' API keys (`sleevesight.mutation`;
# `design/mutation-testing.md`): it changes that code on purpose, a condition flipped or a call
# dropped, and checks that a test fails each time. Too slow for every pull request, so nightly and by
# hand. Each module's score must reach its `mutationThreshold`, so a new mutant no test kills fails
# the run; the report, uploaded either way, lists it.
#
# Every action is pinned to a commit, with its version in a comment, as in `ci.yml` (#1037).

on:
  schedule:
    # Nightly, 03:41 UTC: off the hour, when scheduled runs queue the longest.
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pitest:
    name: Pitest on the key code
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads Gradle's cache and leaves it as it is: nothing else uses this job's outputs.
      - uses: ./.github/actions/java-gradle
        with:
          cache-read-only: "true"

      - name: Mutation testing
        # `--continue`: one module under its threshold still lets the other run and report.
        run: ./gradlew :core:pitest :cli:pitest --continue --console=plain

      # The score of each module, from the XML report, in the run's summary.
      - name: Scores
        if: ${{ !cancelled() }}
        run: |
          for module in core cli; do
            report="$module/build/reports/pitest/mutations.xml"
            [ -f "$report" ] || continue
            total=$(grep -o '<mutation ' "$report" | wc -l)
            killed=$(grep -o "status='KILLED'" "$report" | wc -l)
            echo "\`:$module\`: $killed of $total mutants killed." >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-reports
          path: |
            core/build/reports/pitest/
            cli/build/reports/pitest/
          if-no-files-found: warn
          retention-days: 14
