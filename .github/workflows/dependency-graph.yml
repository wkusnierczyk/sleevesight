name: Dependency graph

# The Gradle build's dependencies, submitted to GitHub's dependency graph (#235), so Dependabot's
# alerts and security updates (#236) cover them, transitive ones included; without it the graph
# lists only the workflows' actions. Every configuration the build resolves is submitted: the app's
# libraries, the build logic's plugins and the tests, since a build tool runs with the release's
# secrets. On each push to `main`, the branch the alerts describe.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-graph
  cancel-in-progress: true

jobs:
  # Two jobs, so that build code never runs beside a token that can write to the repository (#1090):
  # this one runs the Gradle build, plugins and all, with a read-only token and saves the graph as
  # a workflow artifact; the next one only submits it.
  generate:
    name: Generate the Gradle dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: generate-and-upload
          # Only the next job reads it.
          artifact-retention-days: 1

  submit:
    name: Submit the Gradle dependency graph
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The dependency submission API, for this job alone. No checkout and no build: the action
      # downloads this run's graph artifact and submits it.
      contents: write
    steps:
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: download-and-submit
          # Nothing is built here, so there is nothing to restore or save.
          cache-disabled: true
