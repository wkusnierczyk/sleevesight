name: Release

# A version tag, `v<major>.<minor>.<patch>`, builds the app bundle for Google Play, signed with the
# upload key, and uploads it to a Play track (D7; `design/release.md`). The key is in the `release`
# environment's secrets, which only tags matching `v*` may use, and each run waits for a reviewer's
# approval before it starts. The actions are pinned to commits, since the job holds the key.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    # `id-token` lets the job ask GitHub for an OIDC token, which Google exchanges for a short-lived
    # access token to the Play Developer API (Workload Identity Federation): no stored Google key.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A release is built from `main`: a tag on any other commit stops here. A guard against
      # mistakes: the check is in the tagged commit's own workflow, so the creation ruleset and the
      # environment's approval are what stop a tag elsewhere. The branch is named in full, so a tag
      # called `origin/main` cannot stand in for it.
      - name: Tagged commit on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

      # The tag without its `v`; Gradle checks its form and derives `versionCode` from it.
      - name: Version from the tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Every release ships with its notes, reviewed with the change that ships: a missing file stops
      # the run before the build. Play takes at most 500 characters per language.
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          notes="release-notes/$VERSION.txt"
          if [ ! -f "$notes" ]; then
            echo "::error::No release notes: add $notes (design/release.md)"
            exit 1
          fi
          .github/scripts/check-release-notes.sh "$notes"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # No cache: the signed bundle is built from a clean state, with no task output restored from
      # another run. A release is rare, so the extra minutes do not matter.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # An unset secret reads as empty; the build then fails on the missing variables rather than
      # produce an unsigned bundle.
      - name: Upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::The release environment has no UPLOAD_KEYSTORE_BASE64 secret (design/release.md)"
            exit 1
          fi
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.p12"

      - name: Signed bundle
        env:
          SLEEVESIGHT_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.p12
          SLEEVESIGHT_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          SLEEVESIGHT_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          SLEEVESIGHT_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.name }}
        run: ./gradlew :app:bundleRelease -Psleevesight.version="$VERSION" --no-build-cache --console=plain

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"

      # `jarsigner -verify` succeeds on an unsigned bundle too, so its output is checked. The
      # signer's SHA-256 fingerprint must be the upload certificate's, which Play Console shows and
      # the environment variable `UPLOAD_CERT_SHA256` records once the first bundle is uploaded.
      - name: Check the signature
        env:
          UPLOAD_CERT_SHA256: ${{ vars.UPLOAD_CERT_SHA256 }}
        run: |
          aab=app/build/outputs/bundle/release/app-release.aab
          out=$(jarsigner -verify "$aab")
          echo "$out"
          case "$out" in
            *"jar verified."*) ;;
            *) echo "::error::$aab is not signed"; exit 1 ;;
          esac
          normalize() { tr -d ': ' | tr '[:lower:]' '[:upper:]'; }
          actual=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | normalize)
          if [ -z "$actual" ] || [ "${#actual}" -ne 64 ]; then
            echo "::error::Could not read one SHA-256 fingerprint of the signer"
            exit 1
          fi
          echo "Signer SHA-256: $actual"
          expected=$(printf '%s' "$UPLOAD_CERT_SHA256" | normalize)
          if [ -z "$expected" ]; then
            echo "::notice::The release environment has no UPLOAD_CERT_SHA256 variable; set it to the upload certificate's SHA-256 once Play Console shows it (design/release.md)"
          elif [ "$actual" != "$expected" ]; then
            echo "::error::Signed by $actual, not by the upload key $expected"
            exit 1
          fi

      # The R8 mapping is in the bundle as well, where Play Console reads it; the copy here is for
      # retracing a stack trace locally.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sleevesight-${{ steps.version.outputs.name }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      # The bundle is kept as an artifact above, so a failure from here on can still be uploaded by
      # hand. The environment's variables name the Google service account and the identity provider
      # that lets this repository act as it (`design/release.md`, *Google Play Developer API*).
      - name: Google Play setup
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PROVIDER" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::The release environment needs the variables GCP_WORKLOAD_IDENTITY_PROVIDER and PLAY_SERVICE_ACCOUNT (design/release.md); the bundle is in the run's artifact"
            exit 1
          fi

      # No credentials file and no environment variables: the token is used by the next step only.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: google
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false

      # The track is the environment's variable `PLAY_TRACK`, `internal` when unset, so the closed
      # test (#58) can take its bundles from the same job. `PLAY_RELEASE_STATUS`, `completed` when
      # unset, can be `draft` while Play treats the app as a draft (`design/release.md`).
      - name: Upload to Google Play
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
          STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          .github/scripts/play-upload.sh app.sleevesight \
            app/build/outputs/bundle/release/app-release.aab \
            "$VERSION" "$TRACK" "release-notes/$VERSION.txt" "$STATUS"
