name: Release

# A version tag, `v<major>.<minor>.<patch>`, builds the app bundle for Google Play, signed with the
# upload key, and uploads it to a Play track (D7; `design/release.md`). Two jobs: `bundle` builds and
# signs it, with Gradle and the key; `upload` sends it to Play, with no Gradle, and only it may ask
# for the token Play takes. So the build's dependencies never run where that token can be minted.
# Both jobs run in the `release` environment: the key is in its secrets, and Google gives the token
# only to a job of that environment. Only tags matching `v*` may use it, and each job that names it
# waits for a reviewer's approval before it starts. `upload` needs `bundle`, so a release takes two
# approvals: one before the build, and one before the upload, once the bundle exists. The actions
# are pinned to commits, since the jobs hold the key and the token.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    # No `id-token`: the job that runs the build cannot ask for the token that reaches Play.
    permissions:
      contents: read
    # The track and developer mode the bundle is built for, decided before the build runs, so no
    # step of the build can change them; `upload` checks its own decision against them.
    outputs:
      track: ${{ steps.track.outputs.name }}
      developer-mode: ${{ steps.track.outputs.developer-mode }}
    steps:
      # No token kept in `.git/config`: nothing after the checkout pushes, and the repository is
      # public, so the fetch below needs none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release is built from `main`: a tag on a commit that is not on `main` stops here. A guard
      # against mistakes: the check is in the tagged commit's own workflow, so the creation ruleset
      # and the environment's approval are what stop a tag elsewhere. The branch is named in full, so
      # a tag called `origin/main` cannot stand in for it.
      - name: Tagged commit on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

      # The tag without its `v`; Gradle checks its form and derives `versionCode` from it.
      - name: Version from the tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The track the bundle is for: the environment's variable `PLAY_TRACK`, `internal` when unset.
      # A bundle for a testing track starts in developer mode, so testers reach *Diagnostics* without
      # seven taps on *Version*; one for `production` does not (#451). Play promotes a bundle from
      # one track to the next as it is, so the production release is a bundle of its own, from a tag
      # of its own on the tested code: `release-track.sh` refuses a production tag that changes more
      # than release notes since the tag before it, and a track id it does not take
      # (`design/release.md`, *Test and production builds*). The approval comes before this step,
      # so the summary confirms the track; the check is what stops a `PLAY_TRACK` left at production.
      - name: Track and developer mode
        id: track
        env:
          TRACK: ${{ vars.PLAY_TRACK }}
        run: |
          git fetch --no-tags origin '+refs/tags/v*:refs/tags/v*'
          .github/scripts/release-track.sh "$TRACK" "$GITHUB_REF_NAME" "$GITHUB_SHA"

      # Every release ships with its notes, its branch's last pull request: notes that are
      # missing, or that `check-release-notes.sh` refuses, stop the run before the build. A tag that
      # is no release version is named as such, since the notes' name is checked first.
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: .github/scripts/check-release-notes.sh "release-notes/$VERSION.txt"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # No cache: the signed bundle is built from a clean state, with no task output restored from
      # another run. A release is rare, so the extra minutes do not matter.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # An unset secret reads as empty; the build then fails on the missing variables rather than
      # produce an unsigned bundle.
      - name: Upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::The release environment has no UPLOAD_KEYSTORE_BASE64 secret (design/release.md)"
            exit 1
          fi
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.p12"

      - name: Signed bundle
        env:
          SLEEVESIGHT_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.p12
          SLEEVESIGHT_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          SLEEVESIGHT_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          SLEEVESIGHT_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.name }}
          DEVELOPER_MODE: ${{ steps.track.outputs.developer-mode }}
        run: |
          ./gradlew :app:bundleRelease -Psleevesight.version="$VERSION" \
            -Psleevesight.developerMode="$DEVELOPER_MODE" --no-build-cache --console=plain

      # The value the bundle was compiled with, read back from its build.
      - name: Check developer mode
        env:
          DEVELOPER_MODE: ${{ steps.track.outputs.developer-mode }}
        run: .github/scripts/check-developer-mode.sh release "$DEVELOPER_MODE"

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"

      # The `upload` job takes the bundle from this artifact, and a failed upload can be finished by
      # hand from it. The R8 mapping is in the bundle as well, where Play Console reads it; the copy
      # here is for retracing a stack trace locally.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sleevesight-${{ steps.version.outputs.name }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90


  upload:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    # `id-token` lets the job ask GitHub for an OIDC token, which Google exchanges for a short-lived
    # access token to the Play Developer API (Workload Identity Federation): no stored Google key.
    # It reads no secret and runs no build.
    permissions:
      contents: read
      id-token: write
    steps:
      # The scripts and the notes come from the tagged commit, not from the `bundle` job, so nothing
      # the build ran can change what runs here. Only those directories are checked out (not in cone
      # mode, which would add every file at the root); the history and the tags are fetched for the
      # track's check below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /release-notes/

      - name: Version from the tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The track, decided again as `bundle` decided it, from the same variable and tags, with the
      # production check; its summary line is written by `bundle` already. `PLAY_TRACK` can change
      # between the two approvals, or before a re-run of this job alone, so the decision must equal
      # the one the bundle was built for: a bundle built for a testing track, in developer mode, never
      # goes to production, and a track that differs only makes the upload fail.
      - name: Track
        id: track
        env:
          TRACK: ${{ vars.PLAY_TRACK }}
          BUILT_TRACK: ${{ needs.bundle.outputs.track }}
          BUILT_DEVELOPER_MODE: ${{ needs.bundle.outputs.developer-mode }}
        run: |
          git fetch --no-tags origin '+refs/tags/v*:refs/tags/v*'
          if ! decided=$(GITHUB_OUTPUT='' GITHUB_STEP_SUMMARY='' .github/scripts/release-track.sh "$TRACK" "$GITHUB_REF_NAME" "$GITHUB_SHA"); then
            echo "$decided"
            exit 1
          fi
          echo "$decided"
          track=$(printf '%s\n' "$decided" | sed -n 's/^name=//p')
          developer=$(printf '%s\n' "$decided" | sed -n 's/^developer-mode=//p')
          if [ -z "$BUILT_TRACK" ] || [ "$track" != "$BUILT_TRACK" ] || [ "$developer" != "$BUILT_DEVELOPER_MODE" ]; then
            echo "::error::The bundle was built for track '$BUILT_TRACK' (developer mode $BUILT_DEVELOPER_MODE), but PLAY_TRACK now gives '$track' (developer mode $developer); set PLAY_TRACK back and re-run this job, or re-run all jobs to build for the new track (design/release.md)"
            exit 1
          fi
          echo "name=$track" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sleevesight-${{ steps.version.outputs.name }}
          path: ${{ runner.temp }}/artifact

      # For `jarsigner` and `keytool`; no Gradle.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Checked here, on the bundle that goes to Play, rather than where it was built.
      # `jarsigner -verify` succeeds on an unsigned bundle too, so its output is checked. The
      # signer's SHA-256 fingerprint must be the upload certificate's, which Play Console shows and
      # the environment variable `UPLOAD_CERT_SHA256` records once the first bundle is uploaded.
      - name: Check the signature
        env:
          UPLOAD_CERT_SHA256: ${{ vars.UPLOAD_CERT_SHA256 }}
        run: |
          aab=$RUNNER_TEMP/artifact/bundle/release/app-release.aab
          out=$(jarsigner -verify "$aab")
          echo "$out"
          case "$out" in
            *"jar verified."*) ;;
            *) echo "::error::$aab is not signed"; exit 1 ;;
          esac
          normalize() { tr -d ': ' | tr '[:lower:]' '[:upper:]'; }
          actual=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | normalize)
          if [ -z "$actual" ] || [ "${#actual}" -ne 64 ]; then
            echo "::error::Could not read one SHA-256 fingerprint of the signer"
            exit 1
          fi
          echo "Signer SHA-256: $actual"
          expected=$(printf '%s' "$UPLOAD_CERT_SHA256" | normalize)
          if [ -z "$expected" ]; then
            echo "::notice::The release environment has no UPLOAD_CERT_SHA256 variable; set it to the upload certificate's SHA-256 once Play Console shows it (design/release.md)"
          elif [ "$actual" != "$expected" ]; then
            echo "::error::Signed by $actual, not by the upload key $expected"
            exit 1
          fi

      # The bundle is kept as the run's artifact, so a failure from here on can still be uploaded by
      # hand. The environment's variables name the Google service account and the identity provider
      # that lets this repository act as it (`design/release.md`, *Google Play Developer API*).
      - name: Google Play setup
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PROVIDER" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::The release environment needs the variables GCP_WORKLOAD_IDENTITY_PROVIDER and PLAY_SERVICE_ACCOUNT (design/release.md); the bundle is in the run's artifact"
            exit 1
          fi

      # No credentials file and no environment variables: the token is used by the next step only.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: google
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false

      # The track is the one the bundle was built for (*Track*), so the closed test (#58) can take
      # its bundles from the same workflow. `PLAY_RELEASE_STATUS`, `completed` when unset, can be
      # `draft` while Play treats the app as a draft (`design/release.md`).
      - name: Upload to Google Play
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          TRACK: ${{ steps.track.outputs.name }}
          STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          .github/scripts/play-upload.sh app.sleevesight \
            "$RUNNER_TEMP/artifact/bundle/release/app-release.aab" \
            "$VERSION" "$TRACK" "release-notes/$VERSION.txt" "$STATUS"
