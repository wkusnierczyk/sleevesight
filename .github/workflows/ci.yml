name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "design/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "design/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, test and lint
        run: ./gradlew build --console=plain

      # `checkManifest` and the debug APK come back with `:app` (#47).
      - name: Structural checks
        run: ./gradlew checkDependencies checkModuleGraph --console=plain
