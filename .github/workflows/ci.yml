name: CI

on:
  # Every pull request runs `build`, docs-only ones included: `main` requires the check, and a
  # required check that never reports leaves the pull request unmergeable.
  pull_request:
  push:
    branches: [main, "dev-*"]
    paths-ignore:
      - "**/*.md"

concurrency:
  # A pull request's runs share a group, so a new push cancels the superseded run. Each branch push
  # gets a group of its own, so no run of a merge is cancelled or replaced while pending.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out its merge commit; the first parent is the base branch.
          fetch-depth: 2

      # A pull request that changes only files the build never reads skips the build, and the job
      # still passes, so the required check reports. The list names those files one by one, so a new
      # file builds until it is added here. `fixtures/` stays out even for its READMEs, since the tests
      # read it as resources, and so does `design/simulator.html`, which a `:core` test reads.
      # Pushes to `main` and `dev-*` always build.
      - name: Changes that need a build
        id: changes
        run: |
          build=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            build=true
          else
            # Read before the loop, so a failed `git diff` fails the step rather than skip the build.
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            while IFS= read -r file; do
              case "$file" in
                README.md | privacy.md | LICENSE | CNAME | _config.yml | index.html | readme-page.html) ;;
                _includes/* | assets/* | release-notes/* | .github/ISSUE_TEMPLATE/*) ;;
                design/*.md | design/brand.html) ;;
                *)
                  echo "Builds for \`$file\`." >> "$GITHUB_STEP_SUMMARY"
                  build=true
                  ;;
              esac
            done <<< "$files"
          fi
          [ "$build" = true ] || echo "No change the build reads: build skipped." >> "$GITHUB_STEP_SUMMARY"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        if: steps.changes.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        if: steps.changes.outputs.build == 'true'
        with:
          # Pushes to `main` and `dev-*` write the cache, since an integration branch's
          # dependencies run ahead of `main`'s.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Robolectric downloads its Android runtime (about 150 MB) from Maven Central into `~/.m2`, which
      # `setup-gradle` does not cache. Keyed on the Robolectric version (`libs.versions.toml`) and
      # its configuration file: a new key downloads afresh, so old runtimes do not pile up in the
      # cache. The SDK it runs is set by each test's `@Config(sdk = …)`, outside the key: a new SDK
      # alone is downloaded on each run until the key next changes, slower but never wrong.
      - uses: actions/cache@v6
        if: steps.changes.outputs.build == 'true'
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

      - name: Build, test and lint
        if: steps.changes.outputs.build == 'true'
        run: ./gradlew build --console=plain

      # Nested TestKit builds of the convention plugins; they need Maven Central, so they are not
      # part of `build`.
      - name: Functional tests of the build logic
        if: steps.changes.outputs.build == 'true'
        run: ./gradlew :build-logic:functionalTest --console=plain

      - name: Structural checks
        if: steps.changes.outputs.build == 'true'
        run: ./gradlew checkDependencies checkManifest checkModuleGraph --console=plain

      # `build` has assembled it already; this names the step that makes it.
      - name: Debug APK
        if: steps.changes.outputs.build == 'true'
        run: ./gradlew :app:assembleDebug --console=plain

      # For installing on a phone or an emulator, such as the restricted-settings test (#29).
      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.build == 'true'
        with:
          name: sleevesight-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
