name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "design/**"
  push:
    branches: [main, "dev-*"]
    paths-ignore:
      - "**/*.md"
      - "design/**"

concurrency:
  # A pull request's runs share a group, so a new push cancels the superseded run. Each branch push
  # gets a group of its own, so none is cancelled or replaced while pending, and every merge is built.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Pushes to `main` and `dev-*` write the cache, since an integration branch's
          # dependencies run ahead of `main`'s.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build, test and lint
        run: ./gradlew build --console=plain

      # `checkManifest` and the debug APK come back with `:app` (#47).
      - name: Structural checks
        run: ./gradlew checkDependencies checkModuleGraph --console=plain
