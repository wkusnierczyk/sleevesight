name: Java and Gradle
description: The JDK and Gradle every Gradle job of `ci.yml` builds with, and Gradle's cache.

inputs:
  cache-read-only:
    description: >-
      "true" to read Gradle's cache and never write it, for a job whose outputs no other job needs
      (`mutation.yml`); by default only pull requests read it alone.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: "21"

    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        # Pushes to `main` and `dev-*` write the cache, since an integration branch's dependencies
        # run ahead of `main`'s. Each job keeps an entry of its own, with the outputs of its tasks.
        # A caller may ask for it read-only itself (`inputs.cache-read-only`).
        cache-read-only: ${{ inputs.cache-read-only == 'true' || github.event_name == 'pull_request' }}
