# Dependabot (#236): security updates (a repository setting) and weekly version updates, for the
# Gradle build (with the dependency graph #235 submits) and the workflows' actions. Its pull requests
# can target only `main`, which takes work only through a release branch, so they are notices, never
# merged as they stand: an agent carries each bump into the open release branch, with the lockfiles
# written again (`--write-locks`), and Dependabot closes its PR once `main` has the new version.
# The prefix's trailing space keeps Dependabot from adding a colon after it.
version: 2
updates:
  - package-ecosystem: gradle
    directories: ["/", "/build-logic"]
    schedule:
      interval: weekly
      day: monday
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    assignees: [wkusnierczyk]
    labels: [infrastructure, "category:D-build", "urgency:low", "importance:medium", "progress:pending", "environment:workstation", "worker:agent"]
    commit-message:
      prefix: "[INFRA] "

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/java-gradle"]
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    assignees: [wkusnierczyk]
    labels: [infrastructure, "category:D-build", "urgency:low", "importance:medium", "progress:pending", "environment:workstation", "worker:agent"]
    commit-message:
      prefix: "[INFRA] "
