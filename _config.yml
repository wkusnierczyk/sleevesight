# GitHub Pages (Jekyll, the default theme) builds the site from `main`: the landing page
# (`index.html`, standalone, no theme), the README (at `/README.html`, since `index.html` takes `/`)
# and the `design/` documents. The title replaces the repository's name in the page titles and
# headers; the description replaces the repository's description in them and in the `og:` tags.
title: Sleevesight
description: Insights on what's playing. An app with short, sourced insights about the artist, song, and album.
# The documentation pages under `docs/` (#421) share a layout: the product page's intro, header and
# footer (#501), its type, and a link back to the index.
defaults:
  - scope:
      path: docs
    values:
      layout: docs
